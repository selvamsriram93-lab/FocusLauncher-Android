
name: Build Focus Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FocusLauncher.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract launcher project
        run: unzip -o FocusLauncher.zip -d .

      - name: Build debug APK
        working-directory: FocusLauncher
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLauncher-APK
          path: FocusLauncher/app/build/outputs/apk/debug/*.apk
          
